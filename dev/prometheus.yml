# Local development only (docker-compose.dev.yml): scrapes the Node Exporter
# container so `npm run dev:local` shows real CPU, memory, disk and network
# figures, those of the Docker machine. Production Prometheus lives on the
# server and is configured there (see README).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
