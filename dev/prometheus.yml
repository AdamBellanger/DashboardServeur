# Local development only (docker-compose.dev.yml): scrapes the Node Exporter
# and cAdvisor containers so `npm run dev:local` shows real CPU, memory, disk,
# network and per-container figures, those of the Docker machine. Production
# Prometheus lives on the server and is configured there (see README).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  # Optional: the target is simply down when cAdvisor isn't running.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
