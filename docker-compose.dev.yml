# Local development only, for `npm run dev:local`: a throwaway PostgreSQL, plus
# Prometheus, Node Exporter and cAdvisor so the dashboard shows real metrics
# (those of the machine running Docker and of its containers). Never used on
# the server (see docker-compose.yml for production).
#
# Host ports 5433 and 9091, so they don't clash with a local install or with
# an SSH tunnel to the server (5432, 9090). Bound to 127.0.0.1 only.
name: status-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: status
      POSTGRES_PASSWORD: status
      POSTGRES_DB: status
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U status -d status"]
      interval: 2s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - node-exporter

  node-exporter:
    image: prom/node-exporter:v1.9.1
    # Host filesystem, read-only, so the disk tile shows the real "/" instead
    # of the container's overlay.
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro

  # Per-container CPU and memory. Optional (profile): dev-local.mjs starts it
  # separately and carries on if it can't run on this machine; the dashboard
  # then simply has no "Containers" tile.
  cadvisor:
    profiles: ["containers"]
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --housekeeping_interval=15s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process,advtcp,memory_numa
      - --containerd=${CADVISOR_CONTAINERD_SOCK:-/run/containerd/containerd.sock}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  db:
  prometheus:
